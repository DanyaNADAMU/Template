name: Release

# Production pipeline template: signed SemVer tags gate through the
# shared release-precheck, build the release image through the shared
# catalog, and roll it out to the production contour. Tag push is the
# only trigger: production deploys never ride on plain commits to main.
#
# Adapt per service:
#   - add the same `test`/`lint` job as in build.yml and make `build`
#     `needs:` it, so a tag can never ship untested code.
#   - container context: point `context`/`file` at the Containerfile
#     directory; version-locked images pass their build args here too.
#   - non-container repositories (Keys, Infra): replace the image jobs
#     with the source-archive attestation flow (git archive ->
#     SHA256SUMS -> `ots stamp` -> GitHub Release with checksums and
#     proof attached).
#
# Repo prerequisites (set once in Settings):
#   - vars.PROD_HOST / vars.PROD_PORT — production sshd coordinates
#   - secrets.PROD_DEPLOY_KEY — dedicated key of the service user
#   - secrets.PROD_DEPLOY_HOST_KEY — known_hosts line for the target
#   The key is pinned with a forced-command `deploy-service <svc> <digest>`
#   so a leak can only roll one service to one image digest.
on:
  push:
    tags:
      - 'v*'

jobs:
  precheck:
    # Shared gate before anything is built: strict SemVer, CHANGELOG
    # section, SSH tag-signature verification against the caller's
    # .allowed_signers, ancestry proof from the production branch.
    uses: Danyanadamu/Workflows/.github/workflows/release-precheck.yml@v1
    with:
      base_branch: main

  build:
    needs: precheck
    permissions:
      contents: read
      packages: write
    uses: Danyanadamu/Workflows/.github/workflows/container-build.yml@v1
    with:
      context: .
      file: ./Containerfile
      image_tag: ${{ github.ref_name }}
      extra_tags: latest

  attest:
    needs: build
    # The signing right lives on the caller's own job: id-token grants
    # never cross a `uses:` boundary, so the catalog cannot sign for us.
    # Public repositories get the full provenance loop (deploy.yml
    # verifies the attestation before touching a host); user-owned
    # private repositories cannot host attestations at all — delete this
    # job there and pass `verify_provenance: false` to the deploy.
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Sign release provenance (Sigstore, runner OIDC)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.build.outputs.image_digest }}

  deploy:
    needs: [build, attest]
    # attestations: read feeds deploy.yml's provenance verification with
    # the job token; public repos could go anonymous, the explicit grant
    # keeps the contour deterministic.
    permissions:
      contents: read
      attestations: read
    uses: Danyanadamu/Workflows/.github/workflows/deploy.yml@v1
    with:
      host: ${{ vars.PROD_HOST }}
      port: ${{ vars.PROD_PORT }}
      user: apps
      image: ${{ needs.build.outputs.image_ref }}
    secrets:
      deploy_key: ${{ secrets.PROD_DEPLOY_KEY }}
      host_key: ${{ secrets.PROD_DEPLOY_HOST_KEY }}

  release-notes:
    needs: deploy
    # Release evidence: the CHANGELOG section travels to the GitHub
    # Release object right after the production rollout it describes.
    # Idempotent for re-runs (edit vs create).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Publish GitHub Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v tag="## [$TAG]" '
            $0 == tag { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::CHANGELOG section for $TAG is empty"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
