name: Release

# Production pipeline template: signed SemVer tags build the release image
# and roll it out to the production contour. Tag push is the only trigger:
# production deploys never ride on plain commits to main.
#
# Adapt per service:
#   - container context: point `context` at the Containerfile directory.
#   - non-container repositories (Keys, Infra): replace the image jobs with
#     the source-archive attestation flow (git archive -> SHA256SUMS ->
#     `ots stamp` -> GitHub Release with checksums and proof attached).
#
# Repo prerequisites (set once in Settings):
#   - vars.PROD_HOST / vars.PROD_PORT — production sshd coordinates
#   - secrets.PROD_DEPLOY_KEY — dedicated key of the service user
#   - secrets.PROD_DEPLOY_HOST_KEY — known_hosts line for the target
#   The key is pinned with a forced-command `deploy-service <svc> <digest>`
#   so a leak can only roll one service to one image digest.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        # GHCR rejects any path segment containing uppercase letters, and
        # github.repository preserves the mixed-case owner/name spelling.
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Record pushed image ref
        id: image
        run: echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    uses: Danyanadamu/Workflows/.github/workflows/deploy.yml@v1
    with:
      host: ${{ vars.PROD_HOST }}
      port: ${{ vars.PROD_PORT }}
      user: apps
      image: ${{ needs.release.outputs.image_ref }}
    secrets:
      deploy_key: ${{ secrets.PROD_DEPLOY_KEY }}
      host_key: ${{ secrets.PROD_DEPLOY_HOST_KEY }}