name: Build & Staging Deploy

# Trunk pipeline template: every push to main or a feature branch builds
# the container image and, on feature branches only, rolls it out to the
# staging testbed. Production releases run from release.yml on tags.
#
# Adapt per service:
#   - container context: point `context` at the directory holding the
#     Containerfile (Agent uses `container/`, most services use `.`).
#   - version lock: if the image is version-locked (vendored upstream),
#     extract the version in a dedicated step and pass it as a build arg
#     and an extra image tag; otherwise the `<sha>` tag alone suffices.
#   - non-container repositories (Keys, Infra): delete this workflow —
#     they have no image to build, only the ots-cron.yml stub remains.
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        # GHCR rejects any path segment containing uppercase letters, and
        # github.repository preserves the mixed-case owner/name spelling.
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        # PR builds are verification-only: no push, so a draft PR can
        # never move the tags the staging testbed pins.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Record pushed image ref
        id: image
        run: echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  staging-deploy:
    needs: build
    # Feature branches deploy to staging for validation; main is
    # released to production via tags in release.yml instead.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    uses: Danyanadamu/Workflows/.github/workflows/deploy.yml@v1
    with:
      host: ${{ vars.STAGING_HOST }}
      port: ${{ vars.STAGING_PORT }}
      user: agent
      image: ${{ needs.build.outputs.image_ref }}
    secrets:
      deploy_key: ${{ secrets.STAGING_DEPLOY_KEY }}
      host_key: ${{ secrets.STAGING_DEPLOY_HOST_KEY }}