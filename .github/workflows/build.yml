name: Build & Staging Deploy

# Trunk pipeline template: every push to main or a feature branch runs
# the service's lint/test jobs, builds the container image through the
# shared catalog, and, on feature branches only, rolls it out to the
# staging testbed. Production releases run from release.yml on tags.
#
# Adapt per service:
#   - add a `test` (and/or `lint`) job before `build` and make `build`
#     `needs:` it — an image must never be produced from unverified
#     code. Reference implementations: Assistant (uv composite action),
#     Agent (shellcheck + hadolint).
#   - container context: point `context`/`file` at the directory holding
#     the Containerfile (Agent uses `container/`, most services use `.`).
#   - version lock: if the image is version-locked (vendored upstream),
#     add a `resolve` job extracting the version, pass it as a build arg
#     in `build_args`, and publish it as an `extra_tag` on main pushes
#     only; otherwise the `<sha>` tag alone suffices.
#   - non-container repositories (Keys, Infra): delete this workflow —
#     they have no image to build, only the ots-cron.yml stub remains.
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    # Documentation-only pushes skip the pipeline: no image content can
    # change, so the build and the staging roll they would trigger are
    # pure runner cost.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  # Same-branch pushes queue, the newest pending run supersedes older
  # ones, but a running deploy is NEVER cancelled mid-roll: the wrapper
  # owns capture/rollback atomically and a half-cut deploy is exactly
  # what it exists to prevent.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Single canonical build path from the shared catalog: lowercase
    # GHCR name, layer cache, provenance + SBOM, Trivy severity gate.
    permissions:
      contents: read
      packages: write
    uses: Danyanadamu/Workflows/.github/workflows/container-build.yml@v1
    with:
      context: .
      file: ./Containerfile
      image_tag: ${{ github.sha }}
      # PR builds are verification-only: no push, so a draft PR can
      # never move the tags the staging testbed pins.
      push: ${{ github.event_name != 'pull_request' }}

  staging-deploy:
    needs: build
    # Feature branches deploy to staging for validation; main is
    # released to production via tags in release.yml instead.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    uses: Danyanadamu/Workflows/.github/workflows/deploy.yml@v1
    with:
      host: ${{ vars.STAGING_HOST }}
      port: ${{ vars.STAGING_PORT }}
      user: agent
      image: ${{ needs.build.outputs.image_ref }}
    secrets:
      deploy_key: ${{ secrets.STAGING_DEPLOY_KEY }}
      host_key: ${{ secrets.STAGING_DEPLOY_HOST_KEY }}
