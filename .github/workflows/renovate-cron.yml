name: Renovate Dependencies

# Self-hosted Renovate: no GitHub App installation (a web remainder), no
# external service — the bot runs here, on a schedule, against this
# repository's own renovate.json. Update PRs are authored with
# RENOVATE_TOKEN (a fine-grained PAT with contents + pull-requests
# write) because GITHUB_TOKEN-authored PRs never trigger CI workflows,
# and an unvalidated bump PR defeats the point. Until that secret is
# provisioned the job warns and passes: wiring must never block.
on:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Token gate
        id: gate
        env:
          TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::RENOVATE_TOKEN is not set — dependency update PRs are disabled until a fine-grained PAT (contents + pull-requests write) is provisioned as the secret."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Renovate
        if: steps.gate.outputs.has_token == 'true'
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
